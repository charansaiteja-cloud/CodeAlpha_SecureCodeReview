rules:
  - id: python-unsafe-shell-true
    pattern: subprocess.run(..., shell=True, ...)
    message: "Avoid shell=True in subprocess calls to prevent command injection."
    severity: ERROR
    languages: [python]

  - id: python-unsafe-pickle-loads
    pattern: pickle.loads(...)
    message: "Avoid deserializing untrusted data with pickle."
    severity: ERROR
    languages: [python]
