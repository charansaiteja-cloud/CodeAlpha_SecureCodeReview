name: Secure Code Review CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-bandit:
    name: Tests and Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -v

      - name: Run Bandit
        run: bandit -r app -ll

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    env:
      SEMGREP_SEND_METRICS: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run custom Semgrep rules
        run: semgrep scan --config .semgrep/rules.yml app/

      - name: Run Semgrep OSS rules
        run: semgrep scan --config p/default --metrics=off app/
